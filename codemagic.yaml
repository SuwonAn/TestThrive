workflows:
  ios_free_build:
    name: iOS Free Build
    max_build_duration: 60

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'        # main 브랜치에 push될 때 자동 빌드 (필요시 'master'나 '*'로 변경)
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      xcode: latest

    scripts:
      - name: Build iOS app (unsigned)
        script: |
          xcodebuild \
            -project "TestThrive.xcodeproj" \
            -scheme "TestThrive" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/**/*.app
