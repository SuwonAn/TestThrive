workflows:
  ios_free_build:
    name: iOS Free Build
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Build iOS app (unsigned)
        script: |
          xcodebuild \
            -project "TestThrive.xcodeproj" \
            -scheme "TestThrive" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/**/*.app
