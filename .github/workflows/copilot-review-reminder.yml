name: Copilot Review Reminder

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

permissions:
  pull-requests: write

jobs:
  remind:
    name: Add Copilot review reminder
    runs-on: ubuntu-latest
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == 'needs-copilot-review'
    steps:
      - name: Post reminder comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = "<!-- copilot-review-reminder -->";

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const alreadyPosted = comments.some((comment) =>
              comment.body && comment.body.includes(marker)
            );

            if (alreadyPosted) {
              console.log("Reminder comment already exists. Skipping.");
              return;
            }

            const body = [
              marker,
              "## Copilot Review",
              "Copilot review can be requested directly in this PR.",
              "",
              "Use this command in a PR comment:",
              "```text",
              "/copilot review",
              "```",
              "",
              "Optional focused request:",
              "```text",
              "/copilot review focus on async loading, navigation flow, and API mapping risks.",
              "```"
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body
            });
