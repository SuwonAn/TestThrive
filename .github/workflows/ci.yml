name: CI - Build & Test

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

env:
  XCODE_VERSION: 15.2
  DEPLOYMENT_TARGET: 13.0

jobs:
  pr-review-gate:
    name: PR Review Checklist Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Validate Copilot review checklist
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- pr-review-gate-warning -->";
            const issue_number = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseRef = context.payload.pull_request.base.ref;
            const strictMode = baseRef === "main";

            const prBody = context.payload.pull_request.body || "";
            const labels = (context.payload.pull_request.labels || []).map((label) => label.name);

            const hasCopilotRequestChecked = /-\s*\[[xX]\]\s*I requested Copilot review on this PR\./.test(prBody);
            const hasLabelChecklistChecked = /-\s*\[[xX]\]\s*I added the `needs-copilot-review` label when focused review is needed\./.test(prBody);
            const hasNeedsCopilotLabel = labels.includes("needs-copilot-review");

            const warnings = [];

            if (!hasCopilotRequestChecked) {
              warnings.push("`Copilot code review` 체크박스가 체크되지 않았습니다. 필요 시 `/copilot review` 코멘트를 남겨주세요.");
            }

            if (hasLabelChecklistChecked && !hasNeedsCopilotLabel) {
              warnings.push("체크리스트에는 `needs-copilot-review` 라벨을 추가했다고 표시했지만, 실제 PR 라벨이 없습니다.");
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find((comment) =>
              comment.body && comment.body.includes(marker)
            );

            if (warnings.length === 0) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body: `${marker}\n✅ PR 리뷰 체크리스트 상태가 정상입니다.`
                });
              }
              return;
            }

            const body = [
              marker,
              "## PR Review Checklist Warning",
              "아래 항목을 확인해 주세요:",
              "",
              ...warnings.map((warning) => `- ${warning}`),
              "",
              "필요 시 아래 명령어로 코파일럿 리뷰를 요청할 수 있습니다:",
              "```text",
              "/copilot review",
              "```"
            ].join("\n");

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

            if (strictMode) {
              throw new Error("Copilot review checklist requirements are not met for PRs targeting main.");
            }

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint --config .swiftlint.yml

  build:
    name: Build (Debug)
    runs-on: macos-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select --switch /Applications/Xcode_15.2.app

      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -workspace TestThrive/TestThrive.xcworkspace \
            -scheme TestThrive \
            -configuration Debug \
            -derivedDataPath DerivedData \
            -destination generic/platform=iOS \
            -quiet

  test:
    name: Unit Tests
    runs-on: macos-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select --switch /Applications/Xcode_15.2.app

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -workspace TestThrive/TestThrive.xcworkspace \
            -scheme TestThrive \
            -configuration Debug \
            -only-testing:TestThriveTests \
            -derivedDataPath DerivedData \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -quiet

      - name: Generate coverage report
        run: |
          xcodebuild test \
            -workspace TestThrive/TestThrive.xcworkspace \
            -scheme TestThrive \
            -configuration Debug \
            -only-testing:TestThriveTests \
            -derivedDataPath DerivedData \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -enableCodeCoverage YES \
            -quiet

  notify-failure:
    name: Notify Slack on Failure
    runs-on: macos-latest
    needs: [ lint, build, test ]
    if: failure()
    steps:
      - name: Send Slack message
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ CI Failed for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *CI Pipeline Failed*\n*Repository:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
